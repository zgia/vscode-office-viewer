name: CI
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - run: npm ci
    - run: |
        echo ">>> Start compile vscode-office-viewer."
        npm run build
        echo ">>> Compile vscode-office-viewer success!"